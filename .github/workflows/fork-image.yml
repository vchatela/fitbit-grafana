# Fork-only: builds main into ghcr.io/vchatela/fitbit-fetch-data.
#
# Upstream's prod.push.yml is guarded on thisisarpanghosh/fitbit-fetch-data and
# never runs in a fork, and GitHub does not register a fork's inherited
# workflows either, so without this file no image of this fork exists at all —
# which is why a merged dependency bump here reaches nothing deployed.
name: Fork image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: ${{ github.repository == 'vchatela/fitbit-grafana' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag
        id: tag
        run: echo "tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/vchatela/fitbit-fetch-data:${{ steps.tag.outputs.tag }}
            ghcr.io/vchatela/fitbit-fetch-data:main

      - name: Digest
        run: echo "ghcr.io/vchatela/fitbit-fetch-data:${{ steps.tag.outputs.tag }}@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
